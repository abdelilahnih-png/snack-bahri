<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sel Marin — Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#12201C;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    background:#1B2A24;
    border:1px solid rgba(217,164,65,.2);
    border-radius:20px;
    padding:40px 32px;
    width:100%;
    max-width:360px;
    text-align:center;
  }
  .logo{
    font-size:36px;
    font-style:italic;
    font-weight:700;
    color:#D9A441;
    letter-spacing:-0.01em;
    margin-bottom:6px;
    font-family:Georgia,serif;
  }
  .sub{
    color:#8FA396;
    font-size:13px;
    margin-bottom:32px;
    font-family:monospace;
    letter-spacing:.08em;
  }
  .spinner{
    width:40px;height:40px;
    border:3px solid rgba(217,164,65,.2);
    border-top-color:#D9A441;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 20px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .msg{color:#8FA396;font-size:13px;margin-bottom:24px}
  .msg b{color:#D9A441}
  .btn{
    display:inline-block;
    background:#D9A441;
    color:#12201C;
    font-weight:700;
    font-size:14px;
    padding:13px 28px;
    border-radius:999px;
    cursor:pointer;
    border:none;
    font-family:inherit;
    text-decoration:none;
    transition:background .15s;
    margin-top:8px;
  }
  .btn:hover{background:#e5b458}
  .btn-ghost{
    background:transparent;
    color:#8FA396;
    border:1px solid rgba(143,163,150,.3);
    margin-top:10px;
    display:block;
    width:100%;
  }
  .btn-ghost:hover{color:#D9A441;border-color:#D9A441}
  .countdown{
    font-family:monospace;
    font-size:28px;
    color:#D9A441;
    margin:10px 0 6px;
    letter-spacing:.1em;
  }
  .error-box{
    background:rgba(168,70,47,.15);
    border:1px solid rgba(168,70,47,.4);
    border-radius:12px;
    padding:14px;
    color:#c97a63;
    font-size:13px;
    margin-bottom:18px;
    display:none;
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">Sel Marin</div>
  <div class="sub">ADMINISTRATION</div>
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="msg">Redirection vers le panneau admin<br><b>snack_bahri_fixed.html#admin</b></div>
  <div class="countdown" id="countdown">3</div>
  <div class="error-box" id="errorBox"></div>
  <button class="btn" id="goBtn" onclick="goNow()" style="display:none">Accéder maintenant →</button>
  <a href="./snack_bahri_fixed.html" class="btn btn-ghost" style="display:none" id="homeBtn">← Retour au site client</a>
</div>

<script>
  const TARGET = './snack_bahri_fixed.html#admin';
  const FALLBACK = './snack_bahri.html#admin'; // original filename fallback

  let seconds = 3;
  const countEl = document.getElementById('countdown');
  const spinEl  = document.getElementById('spinner');
  const msgEl   = document.getElementById('msg');
  const goBtn   = document.getElementById('goBtn');
  const homeBtn = document.getElementById('homeBtn');
  const errBox  = document.getElementById('errorBox');

  // Countdown timer
  const timer = setInterval(()=>{
    seconds--;
    countEl.textContent = seconds;
    if(seconds <= 0){
      clearInterval(timer);
      goNow();
    }
  }, 1000);

  function goNow(){
    clearInterval(timer);
    countEl.style.display = 'none';
    spinEl.style.display  = 'none';
    goBtn.style.display   = 'none';

    // Try to navigate — if file not found, show fallback options
    try{
      window.location.href = TARGET;
      // After 2s, if still here, show manual button (navigation may have failed)
      setTimeout(()=>{
        msgEl.innerHTML = `Fichier introuvable? Essayez :<br><b>${TARGET}</b>`;
        errBox.textContent = `⚠️ Assurez-vous que snack_bahri_fixed.html est dans le même dossier que ce fichier admin.html.`;
        errBox.style.display = 'block';
        goBtn.textContent = 'Essayer snack_bahri.html#admin';
        goBtn.onclick = ()=>{ window.location.href = FALLBACK; };
        goBtn.style.display = 'inline-block';
        homeBtn.style.display = 'block';
      }, 2000);
    } catch(e){
      errBox.textContent = `Erreur: ${e.message}`;
      errBox.style.display = 'block';
      goBtn.style.display = 'inline-block';
      homeBtn.style.display = 'block';
    }
  }

  // Show manual button after 1s so user doesn't have to wait
  setTimeout(()=>{ goBtn.style.display = 'inline-block'; }, 1000);
</script>
</body>
</html>
